[project]
name = "Flow Control System Client"
version = "0.0.1"

[tool.pyside6-project]
files = ["contents/code/backend.py", "contents/code/main.py", "contents/code/splash.py", "contents/qml/Splash.qml", "contents/qml/Websocket.qml", "contents/qml/main.qml", "contents/qml/pages/Actuators.qml", "contents/qml/pages/Dashboard.qml", "contents/qml/pages/Graphs.qml", "contents/qml/pages/Sidebar.qml", "contents/qmldir", "tools/populate_breeze_fallback.py"]

[tool.pylint.main]
extension-pkg-allow-list = ["PySide6"]
ignored-modules = ["__feature__"]

[tool.pylint."messages control"]
disable = [
    "raw-checker-failed",
    "bad-inline-option",
    "locally-disabled",
    "file-ignored",
    "suppressed-message",
    "useless-suppression",
]
