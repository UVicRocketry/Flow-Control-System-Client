[project]
name = "Flow Control System Client"
version = "0.0.1"

[tool.pyside6-project]
files = ["contents/code/backend.py", "contents/code/config_manager.py", "contents/code/main.py", "contents/code/splash.py", "contents/code/telemetry_files.py", "contents/code/telemetry_series.py", "contents/qml/LogToaster.qml", "contents/qml/NotificationToast.qml", "contents/qml/NotificationTray.qml", "contents/qml/Splash.qml", "contents/qml/Websocket.qml", "contents/qml/main.qml", "contents/qml/pages/Actuators.qml", "contents/qml/pages/Dashboard.qml", "contents/qml/pages/Graphs.qml", "contents/qml/pages/Sidebar.qml", "contents/qml/pages/dashboard/DashboardFunctions.qml", "contents/qml/pages/dashboard/DashboardHeader.qml", "contents/qml/pages/dashboard/DataActionsPanel.qml", "contents/qml/pages/dashboard/DataDialogs.qml", "contents/qml/pages/dashboard/DataListPanel.qml", "contents/qml/pages/graphs/GraphCanvas.qml", "contents/qml/pages/graphs/GraphCard.qml", "contents/qml/pages/graphs/GraphCardFooter.qml", "contents/qml/pages/graphs/GraphCardHeader.qml", "contents/qml/pages/graphs/GraphEditDialog.qml", "contents/qml/pages/graphs/GraphResizeHandles.qml", "contents/qml/pages/sidebar/ActuatorsViewHelper.qml", "contents/qml/pages/sidebar/DashboardViewHelper.qml", "contents/qml/pages/sidebar/GraphsViewHelper.qml", "contents/qml/pages/sidebar/SidebarBottomBar.qml", "contents/qml/pages/sidebar/SidebarNavList.qml"]

[tool.pylint.main]
extension-pkg-allow-list = ["PySide6"]
ignored-modules = ["__feature__"]

[tool.pylint."messages control"]
disable = [
    "raw-checker-failed",
    "bad-inline-option",
    "locally-disabled",
    "file-ignored",
    "suppressed-message",
    "useless-suppression",
]
