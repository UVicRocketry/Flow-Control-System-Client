name: Build Packages
on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      rebuild_linux_image:
        description: 'Force rebuild of the cached Arch Linux builder image in GHCR'
        type: boolean
        default: false

jobs:
  # ============================================================================
  # 1. ARCH LINUX BUILDER IMAGE (Pre-baked & cached in GHCR)
  # ============================================================================
  ensure-linux-image:
    name: Ensure Arch Builder Image (GHCR)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve GHCR image reference
        id: resolve
        shell: bash
        run: |
          OWNER_LOWER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          IMAGE_REPO="ghcr.io/${OWNER_LOWER}/flow-control-linux-builder"
          DEPS_HASH="${{ hashFiles('packaging/Dockerfile.arch', 'packaging/arch-packages.txt', 'requirements.txt') }}"
          TAG="deps-${DEPS_HASH:0:16}"
          IMAGE="${IMAGE_REPO}:${TAG}"
          echo "image_repo=${IMAGE_REPO}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Check whether builder image exists in GHCR
        id: check
        shell: bash
        run: |
          if [ "${{ inputs.rebuild_linux_image }}" = "true" ]; then
            echo "Manual rebuild requested; building image."
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
          elif docker manifest inspect "${{ steps.resolve.outputs.image }}" >/dev/null 2>&1; then
            echo "Found cached builder image: ${{ steps.resolve.outputs.image }}"
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Builder image not found in GHCR; building ${{ steps.resolve.outputs.image }}."
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Arch Linux builder image
        if: steps.check.outputs.needs_build == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          EXTRA_TAG=()
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            EXTRA_TAG=(-t "${{ steps.resolve.outputs.image_repo }}:latest")
          fi
          docker buildx build \
            --push \
            --provenance=false \
            --file packaging/Dockerfile.arch \
            --secret id=github_token,env=GITHUB_TOKEN \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            -t "${{ steps.resolve.outputs.image }}" \
            "${EXTRA_TAG[@]}" \
            .

  # ============================================================================
  # 2. LINUX BUILD (Pre-baked Arch Linux + Anylinux sharun AppImage)
  # ============================================================================
  build-linux:
    name: Linux AppImage (x86_64)
    needs: [ensure-linux-image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.ensure-linux-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Flow Control into /usr
        shell: bash
        run: |
          set -euo pipefail
          install -d /usr/share/FlowControl/contents/config/graphs
          cp -a contents/code contents/qml contents/icons /usr/share/FlowControl/contents/
          find /usr/share/FlowControl/contents -type d -name '__pycache__' -exec rm -rf {} +
          find /usr/share/FlowControl/contents -type f -name '*.log' -delete

          cp -a contents/config/config.json /usr/share/FlowControl/contents/config/config.json
          cp -a contents/config/graphs/graphs.json /usr/share/FlowControl/contents/config/graphs/graphs.json

          install -Dm644 packaging/icon.png /usr/share/icons/hicolor/256x256/apps/flow-control.png
          install -Dm644 contents/qml/img/icon.svg /usr/share/icons/hicolor/scalable/apps/flow-control.svg
          install -Dm644 packaging/flow-control.desktop /usr/share/applications/flow-control.desktop

          install -d /usr/bin
          cat <<'EOF' > /usr/bin/FlowControl
          #!/bin/sh
          set -e
          HERE="$(dirname "$(readlink -f "$0")")"
          export FLOW_CONTROL_USE_USER_CONFIG=1
          export QT_QUICK_CONTROLS_STYLE="${QT_QUICK_CONTROLS_STYLE:-org.kde.desktop}"
          export QT_QPA_PLATFORM="${QT_QPA_PLATFORM:-wayland;xcb}"
          exec python3 "${HERE}/../share/FlowControl/contents/code/main.py" "$@"
          EOF
          chmod 755 /usr/bin/FlowControl

      - name: Bundle & Package AppImage with quick-sharun
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          export ARCH=x86_64
          export APPDIR="$PWD/build/AppDir"
          export OUTPATH="$PWD/dist"
          export OUTNAME="FlowControl-Linux-x86_64.AppImage"

          mkdir -p "$APPDIR/share" "$OUTPATH"
          cp -a /usr/share/FlowControl "$APPDIR/share/FlowControl"

          if [ -d /opt/sharun-tools/cache ]; then
            cp -af /opt/sharun-tools/cache/* /tmp/
            if [ -f /tmp/sharun+helper-libs-x86_64.tar ]; then
              tar -xf /tmp/sharun+helper-libs-x86_64.tar -C "$APPDIR" sharun dash 2>/dev/null || \
                tar -xf /tmp/sharun+helper-libs-x86_64.tar -C "$APPDIR" sharun
              chmod +x "$APPDIR"/sharun "$APPDIR"/dash 2>/dev/null || true
            fi
          fi

          export DESKTOP="/usr/share/applications/flow-control.desktop"
          export ICON="/usr/share/icons/hicolor/256x256/apps/flow-control.png"
          export MAIN_BIN="FlowControl"
          export DEPLOY_PYTHON=1
          export DEPLOY_QT=1
          export DEPLOY_QML=1
          export DEPLOY_KF=1
          export USE_HOST_DRIVERS=1
          export STRACE_MODE=0
          export DEPLOY_LOCALE=0
          export DEPLOY_DATADIR=0
          export NO_STRIP=1
          export OUTPUT_APPIMAGE=1

          /opt/sharun-tools/quick-sharun.sh \
            /usr/bin/FlowControl \
            /usr/lib/python*/lib-dynload/_ssl*.so \
            /usr/lib/python*/lib-dynload/_hashlib*.so \
            /usr/lib/libQt6Core.so.6 \
            /usr/lib/libQt6Gui.so.6 \
            /usr/lib/libQt6Widgets.so.6 \
            /usr/lib/libQt6Qml.so.6 \
            /usr/lib/libQt6Quick.so.6 \
            /usr/lib/libQt6QuickControls2.so.6 \
            /usr/lib/libQt6QuickLayouts.so.6 \
            /usr/lib/libQt6QuickShapes.so.6 \
            /usr/lib/libQt6Network.so.6 \
            /usr/lib/libQt6Svg.so.6 \
            /usr/lib/libQt6SvgWidgets.so.6 \
            /usr/lib/libQt6OpenGL.so.6 \
            /usr/lib/libQt6OpenGLWidgets.so.6 \
            /usr/lib/libQt6WebSockets.so.6 \
            /usr/lib/libQt6Multimedia.so.6 \
            /usr/lib/libQt6MultimediaQuick.so.6 \
            /usr/lib/libKF6*.so.6 \
            /usr/lib/qt6/plugins/kf6/kirigami/platform/*.so

          test -x dist/FlowControl-Linux-x86_64.AppImage
          ls -lh dist/FlowControl-Linux-x86_64.AppImage

      - name: Upload Linux AppImage Artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/FlowControl-Linux-x86_64.AppImage
          archive: false
          if-no-files-found: error

  # ============================================================================
  # 2. WINDOWS BUILD (MSYS2 Pre-Built Binaries -> Portable .zip)
  # ============================================================================
  build-windows:
    name: Windows Portable (.zip)
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize MSYS2 Base Shell
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          location: D:\msys64
          update: false
          cache: false

      - name: Restore Cached MSYS2 UCRT64 Installed Packages
        uses: actions/cache@v5
        id: msys2-env-cache
        with:
          path: |
            D:\msys64\msys64\ucrt64
            D:\msys64\msys64\var\lib\pacman
          key: win-msys2-ucrt64-env-v5-${{ hashFiles('requirements.txt', 'requirements-build.txt') }}

      - name: Install MSYS2 & Python packages (Skipped on Cache Hit)
        if: steps.msys2-env-cache.outputs.cache-hit != 'true'
        run: |
          pacman -Sy --noconfirm --needed \
            mingw-w64-ucrt-x86_64-python \
            mingw-w64-ucrt-x86_64-python-pip \
            mingw-w64-ucrt-x86_64-pyside6 \
            mingw-w64-ucrt-x86_64-pyinstaller \
            mingw-w64-ucrt-x86_64-python-pillow \
            mingw-w64-ucrt-x86_64-kirigami \
            mingw-w64-ucrt-x86_64-qqc2-desktop-style \
            mingw-w64-ucrt-x86_64-breeze \
            mingw-w64-ucrt-x86_64-breeze-icons \
            mingw-w64-ucrt-x86_64-kcoreaddons \
            mingw-w64-ucrt-x86_64-ki18n \
            mingw-w64-ucrt-x86_64-kiconthemes \
            mingw-w64-ucrt-x86_64-qt6-websockets \
            mingw-w64-ucrt-x86_64-qt6-multimedia

          grep -ivE "pyside6|shiboken6" requirements.txt > requirements-msys2.txt || true
          if [ -s requirements-msys2.txt ]; then
            pip install --no-build-isolation -r requirements-msys2.txt
          fi

      - name: Compile Application with PyInstaller
        run: |
          export CRAFT_ROOT="$(cygpath -w /ucrt64)"
          /ucrt64/bin/pyinstaller --clean --noconfirm packaging/FlowControl.spec

      - name: Package Windows Portable ZIP
        shell: pwsh
        run: |
          7z a -tzip -mx=9 "dist/FlowControl-Windows-Portable.zip" "./dist/FlowControl/*"

      - name: Upload Windows Portable ZIP
        uses: actions/upload-artifact@v7
        with:
          path: dist/FlowControl-Windows-Portable.zip
          archive: false
          if-no-files-found: error

  # ============================================================================
  # 4. GITHUB RELEASE (Triggered on git tag push: v*)
  # ============================================================================
  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v8
        with:
          path: release_artifacts
          skip-decompress: true
      - name: Inspect downloaded artifacts
        run: ls -R release_artifacts
      - name: Publish Release with Assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release_artifacts/**/*.AppImage
            release_artifacts/**/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
