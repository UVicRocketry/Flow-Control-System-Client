name: Build Packages
on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  # ============================================================================
  # 1. LINUX BUILD (AppImage)
  # ============================================================================
  build-linux:
    name: Linux AppImage (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: '3.14'

      - name: Cache Python installed site-packages & appimagetool
        uses: actions/cache@v5
        id: linux-py-cache
        with:
          path: |
            /opt/hostedtoolcache/Python/3.14.*
            ~/.cache/appimagetool
          key: linux-py311-v2-${{ hashFiles('requirements.txt', 'requirements-build.txt') }}

      - name: Cache KDE Neon APT .deb archives
        uses: actions/cache@v5
        id: apt-cache
        with:
          path: /var/cache/apt/archives
          key: linux-apt-neon-kf6-v1

      - name: Add KDE Neon repository & install KF6/Kirigami
        run: |
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://archive.neon.kde.org/public.key | sudo gpg --dearmor --yes -o /etc/apt/keyrings/neon-archive-keyring.gpg
          echo "deb [signed-by=/etc/apt/keyrings/neon-archive-keyring.gpg] http://archive.neon.kde.org/user noble main" | sudo tee /etc/apt/sources.list.d/neon.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 \
            kf6-kirigami \
            kf6-qqc2-desktop-style \
            kf6-kiconthemes \
            kf6-kcoreaddons \
            kf6-ki18n \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates \
            qml6-module-qtquick-shapes

      - name: Install Python dependencies (Skipped on Cache Hit)
        if: steps.linux-py-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Compile Application with PyInstaller
        run: |
          pyinstaller --clean --noconfirm packaging/FlowControl.spec

      - name: Assemble AppDir and Package AppImage
        run: |
          mkdir -p build/AppDir/usr/bin
          mkdir -p build/AppDir/usr/share/applications
          mkdir -p build/AppDir/usr/share/icons/hicolor/256x256/apps
          mkdir -p build/AppDir/usr/share/icons/hicolor/scalable/apps

          # Use `cp -a` (archive mode) instead of `cp -r` to preserve symlinks!
          cp -a dist/FlowControl/. build/AppDir/usr/bin/
          cp packaging/AppRun build/AppDir/AppRun
          chmod +x build/AppDir/AppRun

          # Exclude libraries on AppImage excludelist to eliminate host fontconfig XML attribute errors
          find build/AppDir -name "libfontconfig.so*" -delete || true
          find build/AppDir -name "libfreetype.so*" -delete || true

          # Copy desktop entry and icons
          cp packaging/flow-control.desktop build/AppDir/flow-control.desktop
          cp packaging/flow-control.desktop build/AppDir/usr/share/applications/flow-control.desktop
          cp packaging/icon.png build/AppDir/flow-control.png
          cp packaging/icon.png build/AppDir/usr/share/icons/hicolor/256x256/apps/flow-control.png
          cp contents/qml/img/icon.svg build/AppDir/flow-control.svg
          cp contents/qml/img/icon.svg build/AppDir/usr/share/icons/hicolor/scalable/apps/flow-control.svg

          # Use cached appimagetool if available, otherwise download once
          mkdir -p ~/.cache/appimagetool
          if [ ! -f ~/.cache/appimagetool/appimagetool.AppImage ]; then
            curl -fsSL "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -o ~/.cache/appimagetool/appimagetool.AppImage
            chmod +x ~/.cache/appimagetool/appimagetool.AppImage
          fi
          ~/.cache/appimagetool/appimagetool.AppImage --appimage-extract

          # Package into final AppImage
          export ARCH=x86_64
          ./squashfs-root/AppRun --no-appstream build/AppDir dist/FlowControl-Linux-x86_64.AppImage
          chmod +x dist/FlowControl-Linux-x86_64.AppImage

      - name: Upload Linux AppImage Artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/FlowControl-Linux-x86_64.AppImage
          archive: false
          if-no-files-found: error

  # ============================================================================
  # 2. WINDOWS BUILD (MSYS2 Pre-Built Binaries -> Portable .zip)
  # ============================================================================
  build-windows:
    name: Windows Portable (.zip)
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize MSYS2 Base Shell
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          location: D:\msys64
          update: false
          cache: false

      - name: Restore Cached MSYS2 UCRT64 Installed Packages
        uses: actions/cache@v5
        id: msys2-env-cache
        with:
          path: |
            D:\msys64\msys64\ucrt64
            D:\msys64\msys64\var\lib\pacman
          key: win-msys2-ucrt64-env-v3-${{ hashFiles('requirements.txt', 'requirements-build.txt') }}

      - name: Install MSYS2 & Python packages (Skipped on Cache Hit)
        if: steps.msys2-env-cache.outputs.cache-hit != 'true'
        run: |
          pacman -Sy --noconfirm --needed \
            mingw-w64-ucrt-x86_64-python \
            mingw-w64-ucrt-x86_64-python-pip \
            mingw-w64-ucrt-x86_64-pyside6 \
            mingw-w64-ucrt-x86_64-pyinstaller \
            mingw-w64-ucrt-x86_64-python-pillow \
            mingw-w64-ucrt-x86_64-kirigami \
            mingw-w64-ucrt-x86_64-qqc2-desktop-style \
            mingw-w64-ucrt-x86_64-breeze \
            mingw-w64-ucrt-x86_64-breeze-icons \
            mingw-w64-ucrt-x86_64-kcoreaddons \
            mingw-w64-ucrt-x86_64-ki18n \
            mingw-w64-ucrt-x86_64-kiconthemes

          grep -ivE "pyside6|shiboken6" requirements.txt > requirements-msys2.txt || true
          if [ -s requirements-msys2.txt ]; then
            pip install --no-build-isolation -r requirements-msys2.txt
          fi

      - name: Compile Application with PyInstaller
        run: |
          export CRAFT_ROOT="$(cygpath -w /ucrt64)"
          /ucrt64/bin/pyinstaller --clean --noconfirm packaging/FlowControl.spec

      - name: Package Windows Portable ZIP
        shell: pwsh
        run: |
          7z a -tzip -mx=9 "dist/FlowControl-Windows-Portable.zip" "./dist/FlowControl/*"

      - name: Upload Windows Portable ZIP
        uses: actions/upload-artifact@v7
        with:
          path: dist/FlowControl-Windows-Portable.zip
          archive: false
          if-no-files-found: error

  # ============================================================================
  # 4. GITHUB RELEASE (Triggered on git tag push: v*)
  # ============================================================================
  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v8
        with:
          path: release_artifacts
      - name: Publish Release with Assets
        uses: softprops/action-gh-release@v3
        with:
          files: ""
